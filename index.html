<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Modern Web Guidance: Предотвращение FOUC и декларация схем -->
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const stored = localStorage.getItem("color-scheme");
      if (stored) document.querySelector('meta[name="color-scheme"]').content = stored;
    } catch (e) {}
  </script>

  <title>Основы сетей: От бита до интернета | Интерактивный курс</title>

  <link rel="stylesheet" href="css/book-theme.css">
  <link rel="stylesheet" href="css/interactive-lab.css">
</head>
<body>

  <!-- Сайдбар с оглавлением и прогрессом -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span>🌐</span>
        <span>Основы Сетей</span>
      </div>
      <span class="brand-badge">NETWORKS / 13+</span>
    </div>

    <!-- Индикатор прогресса -->
    <div class="progress-banner">
      <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">
        <span id="progress-text">Пройдено 0 из 9 глав (0%)</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Список глав -->
    <nav class="toc-nav" id="toc-nav"></nav>
  </aside>

  <!-- Основная рабочая область -->
  <main id="main-container">
    <header id="top-nav">
      <button class="btn-icon btn-toggle-sidebar" id="btn-toggle-sidebar" aria-label="Открыть меню">
        ☰
      </button>

      <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-muted);" id="header-course-label">
        Курс основ компьютерных сетей для юных инженеров
      </div>

      <div class="nav-actions">
        <button class="btn-icon" id="btn-sound-toggle" title="Включить / Выключить звук">
          🔊
        </button>
        <button class="btn-icon" id="btn-theme-toggle" title="Переключить тему">
          🌙
        </button>
      </div>
    </header>

    <!-- Читалка главы и интерактивный стенд -->
    <article id="content-view">
      <div style="text-align: center; padding: 60px 0; color: var(--text-muted);">
        Загрузка интерактивной книги...
      </div>
    </article>
  </main>

  <!-- Модульный запуск приложения -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
